<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      :root {
        --bone: #f7f3ec;
        --paper: #fffdf8;
        --ink: #23201c;
        --muted: #6f675d;
        --line: #ddd3c4;
        --clay: #b4643c;
        --sage: #5f7355;
        --danger: #9c3a2a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bone);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
      }
      h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.01em; }
      .sub { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 14px; }
      .card { background: var(--paper); border: 1px solid var(--line); padding: 12px; margin-bottom: 12px; }
      label { display: block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
      input, select, textarea {
        width: 100%; padding: 6px 7px; border: 1px solid var(--line); background: #fff;
        font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; color: var(--ink);
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      button {
        font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 12px;
        padding: 7px 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
        cursor: pointer; width: 100%; margin-top: 8px;
      }
      button.ghost { background: transparent; color: var(--ink); }
      button.tiny { width: auto; margin: 0; padding: 3px 7px; font-size: 11px; }
      button:disabled { opacity: 0.45; cursor: default; }
      .finding { border-top: 1px solid var(--line); padding: 9px 0 0; margin-top: 9px; }
      .finding:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
      .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
      .pill { border: 1px solid var(--line); padding: 1px 5px; }
      .sev-critical { border-color: var(--danger); color: var(--danger); }
      .sev-high { border-color: var(--clay); color: var(--clay); }
      .quote { font-style: italic; margin: 5px 0; color: #3a352e; }
      .fix { font-size: 12px; color: var(--sage); }
      .why { font-size: 11px; color: var(--muted); margin-top: 3px; }
      .actions { display: flex; gap: 5px; margin-top: 6px; }
      .actions button { margin: 0; }
      .status { font-size: 12px; padding: 7px 9px; border: 1px solid var(--line); background: #fff; margin-bottom: 10px; }
      .status.error { border-color: var(--danger); color: var(--danger); }
      .status.ok { border-color: var(--sage); color: var(--sage); }
      .muted { color: var(--muted); font-size: 11px; }
      .hidden { display: none; }
      a { color: var(--clay); }
    </style>
  </head>
  <body>
    <h1>BrandSentinel</h1>
    <div class="sub">Brand review for this document</div>

    <div id="status" class="status hidden"></div>

    <div id="settingsPanel" class="card hidden">
      <label for="apiBase">API base URL</label>
      <input id="apiBase" placeholder="https://brandsentinel.freebuff.app" />
      <div style="height: 8px"></div>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" placeholder="bs_live_..." />
      <button id="saveSettings">Save settings</button>
      <div class="muted" style="margin-top: 6px">
        Stored in your own Google account, never in the document.
      </div>
    </div>

    <div id="reviewPanel" class="card hidden">
      <div class="row">
        <div>
          <label for="channel">Channel</label>
          <select id="channel">
            <option value="instagram">Instagram</option>
            <option value="email">Email</option>
            <option value="linkedin">LinkedIn</option>
            <option value="landing">Landing page</option>
            <option value="print">Print</option>
          </select>
        </div>
        <div>
          <label for="team">Team</label>
          <select id="team">
            <option>Web</option><option>Social</option><option>Email</option><option>Paid</option>
          </select>
        </div>
      </div>
      <button id="reviewBtn">Review this document</button>
      <button id="settingsBtn" class="ghost">API settings</button>
    </div>

    <div id="results" class="hidden">
      <div id="runStatus" class="status"></div>
      <div class="card">
        <label for="reason">Reason (required to reject)</label>
        <input id="reason" placeholder="e.g. claim is not in the ledger" />
      </div>
      <div id="findings"></div>
      <div id="verdict" class="card hidden">
        <div class="muted" id="verdictText"></div>
        <button id="approveBtn">Approve submission</button>
        <button id="rejectBtn" class="ghost">Request revision</button>
      </div>
    </div>

    <script>
      var state = { submissionId: null, findings: [], polls: 0, timer: null, status: null };

      function $(id) { return document.getElementById(id); }

      function say(message, kind) {
        var el = $('status');
        el.className = 'status' + (kind ? ' ' + kind : '');
        el.textContent = message;
        el.classList.toggle('hidden', !message);
      }

      function sayRun(message, kind) {
        var el = $('runStatus');
        el.className = 'status' + (kind ? ' ' + kind : '');
        el.textContent = message;
      }

      function busy(button, isBusy, label) {
        button.disabled = isBusy;
        if (label) button.textContent = label;
      }

      function loadSettings() {
        google.script.run.withSuccessHandler(function (settings) {
          $('apiBase').value = settings.apiBase || '';
          $('apiKey').value = settings.apiKey || '';
          $('settingsPanel').classList.toggle('hidden', settings.configured);
          $('reviewPanel').classList.toggle('hidden', !settings.configured);
          if (!settings.configured) say('Add your API key to start.', '');
        }).getSettings();
      }

      $('saveSettings').onclick = function () {
        var btn = this;
        busy(btn, true, 'Saving...');
        google.script.run
          .withSuccessHandler(function (res) {
            busy(btn, false, 'Save settings');
            if (!res.ok) return say(res.error, 'error');
            say('Settings saved.', 'ok');
            loadSettings();
          })
          .withFailureHandler(function (err) {
            busy(btn, false, 'Save settings');
            say(err.message, 'error');
          })
          .saveSettings($('apiBase').value, $('apiKey').value);
      };

      $('settingsBtn').onclick = function () {
        $('settingsPanel').classList.remove('hidden');
      };

      $('reviewBtn').onclick = function () {
        var btn = this;
        busy(btn, true, 'Submitting...');
        say('Reading the document...', '');
        google.script.run
          .withSuccessHandler(function (res) {
            busy(btn, false, 'Review this document');
            if (!res.ok) return say(res.error, 'error');
            state.submissionId = res.submissionId;
            state.polls = 0;
            say('', '');
            $('results').classList.remove('hidden');
            sayRun('Submitted ' + res.chars.toLocaleString() + ' characters. Running fast lane...');
            poll();
          })
          .withFailureHandler(function (err) {
            busy(btn, false, 'Review this document');
            say(err.message, 'error');
          })
          .submitDocument($('channel').value, $('team').value);
      };

      function poll() {
        clearTimeout(state.timer);
        state.polls++;
        if (state.polls > 20) {
          sayRun('Taking longer than expected. Check the web app for this submission.', 'error');
          return;
        }
        google.script.run.withSuccessHandler(function (res) {
          if (!res.ok) return sayRun(res.error, 'error');
          var run = res.run;
          state.status = run.status;
          var label = {
            draft: 'Draft',
            ai_review: 'Running reviewers...',
            findings_ready: 'Findings ready',
            human_review: 'In human review',
            needs_revision: 'Needs revision',
            approved: 'Approved',
            rejected: 'Rejected',
          }[run.status] || run.status;
          var extra = run.degraded ? ' (degraded: ' + (run.degradedCause || 'model unavailable') + ')' : '';
          sayRun('Status: ' + label + extra, run.degraded ? 'error' : '');
          if (run.status === 'findings_ready' || run.status === 'human_review') {
            loadFindings();
          } else if (run.status === 'ai_review' || run.status === 'draft') {
            state.timer = setTimeout(poll, 2500);
          } else {
            loadFindings();
          }
        }).fetchStatus(state.submissionId);
      }

      function loadFindings() {
        google.script.run.withSuccessHandler(function (res) {
          if (!res.ok) return sayRun(res.error, 'error');
          state.findings = res.findings;
          render();
        }).fetchFindings(state.submissionId);
      }

      function esc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function render() {
        var host = $('findings');
        $('verdict').classList.toggle('hidden', state.status === 'approved' || state.status === 'rejected');
        if (!state.findings.length) {
          host.innerHTML =
            '<div class="card"><strong>No findings.</strong><div class="muted">The reviewers found nothing to change. You can still approve from the web app.</div></div>';
          return;
        }
        host.innerHTML =
          '<div class="muted" style="margin-bottom:8px">' +
          state.findings.length +
          ' finding(s)</div>' +
          state.findings
            .map(function (f, index) {
              var decided = f.status && f.status !== 'pending';
              var buttons = decided
                ? '<div class="muted">Decision: ' + esc(f.status) + '</div>'
                : '<div class="actions">' +
                  '<button class="tiny" data-act="accept" data-i="' + index + '">Accept</button>' +
                  '<button class="tiny ghost" data-act="reject" data-i="' + index + '">Reject</button>' +
                  '<button class="tiny ghost" data-act="highlight" data-i="' + index + '">Show</button>' +
                  '</div>';
              return (
                '<div class="finding">' +
                '<div class="meta">' +
                '<span class="pill sev-' + esc(f.severity) + '">' + esc(f.severity) + '</span>' +
                '<span>' + esc(f.reviewer) + '</span>' +
                '<span>' + esc(f.ruleId) + '</span>' +
                '</div>' +
                '<div class="quote">"' + esc(f.spanText) + '"</div>' +
                (f.whyItMatters ? '<div class="why">' + esc(f.whyItMatters) + '</div>' : '') +
                (f.suggestedFix ? '<div class="fix">Fix: ' + esc(f.suggestedFix) + '</div>' : '') +
                buttons +
                '</div>'
              );
            })
            .join('');
        Array.prototype.forEach.call(host.querySelectorAll('button[data-act]'), function (button) {
          button.onclick = function () {
            var finding = state.findings[Number(button.getAttribute('data-i'))];
            var act = button.getAttribute('data-act');
            if (act === 'highlight') {
              google.script.run
                .withSuccessHandler(function (res) {
                  if (!res.ok) return sayRun(res.error, 'error');
                  sayRun('Highlighted in the document.', 'ok');
                })
                .highlightSpan(finding.spanText, finding.severity);
              return;
            }
            busy(button, true, '...');
            var reason = ($('reason').value || '').trim();
            if (act === 'reject' && reason.length < 3) {
              busy(button, false, 'Reject');
              return sayRun('Add a short reason before rejecting.', 'error');
            }
            google.script.run
              .withSuccessHandler(function (res) {
                busy(button, false, act === 'accept' ? 'Accept' : 'Reject');
                if (!res.ok) return sayRun(res.error, 'error');
                sayRun('Recorded: ' + act, 'ok');
                loadFindings();
              })
              .withFailureHandler(function (err) {
                busy(button, false, act === 'accept' ? 'Accept' : 'Reject');
                sayRun(err.message, 'error');
              })
              .decideFinding(state.submissionId, finding.id, act, reason);
          };
        });
      }

      $('approveBtn').onclick = function () {
        var btn = this;
        busy(btn, true, 'Approving...');
        google.script.run
          .withSuccessHandler(function (res) {
            busy(btn, false, 'Approve submission');
            if (!res.ok) return sayRun(res.error, 'error');
            sayRun('Approved. Receipt is available in the web app.', 'ok');
            poll();
          })
          .withFailureHandler(function (err) {
            busy(btn, false, 'Approve submission');
            sayRun(err.message, 'error');
          })
          .decideSubmission(state.submissionId, 'approve', '');
      };

      $('rejectBtn').onclick = function () {
        var btn = this;
        busy(btn, true, 'Sending...');
        google.script.run
          .withSuccessHandler(function (res) {
            busy(btn, false, 'Request revision');
            if (!res.ok) return sayRun(res.error, 'error');
            sayRun('Marked needs revision.', 'ok');
            poll();
          })
          .decideSubmission(state.submissionId, 'needs_revision', 'Requested from Google Docs sidebar');
      };

      loadSettings();
    </script>
  </body>
</html>
